<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Simples</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <script src="js/admin.js" defer></script>
</head>
<body>

    <main style="padding: 2rem; max-width: 800px; margin: 0 auto;">
        <h1>Painel Administrador</h1>
        
        <div class="card-formulario" style="width: 100%; margin: 2rem 0;">
            <h3>Cadastrar / Editar Evento</h3>
            <form id="form-evento" style="display: flex; flex-direction: column; gap: 1rem; width: 100%;">
                <input type="hidden" id="id-evento">
                
                <input type="text" id="nome-evento" placeholder="Nome do Evento" required style="padding: 0.5rem; border: 1px solid #7a5c3e;">
                <input type="text" id="desc-evento" placeholder="Descrição Breve" required style="padding: 0.5rem; border: 1px solid #7a5c3e;">
                <input type="text" id="data-evento" placeholder="Data (Ex: 15/06/2026)" required style="padding: 0.5rem; border: 1px solid #7a5c3e;">
                
                <select id="recorrente-evento" style="padding: 0.5rem; border: 1px solid #7a5c3e;">
                    <option value="Não">Evento Único</option>
                    <option value="Sim">Evento Recorrente (Se repete)</option>
                </select>

                <button type="submit" style="background: var(--verde); color: white; padding: 0.7rem; font-weight: bold; cursor: pointer;">Salvar Evento</button>
            </form>
        </div>

        <h2>Eventos Cadastrados</h2>
        <table style="width: 100%; border-collapse: collapse; margin-top: 1rem; background: var(--bg-card-claro); border: var(--border);">
            <thead>
                <tr style="background: var(--preto); color: white;">
                    <th style="padding: 0.5rem; text-align: left; color: white;">Nome</th>
                    <th style="padding: 0.5rem; text-align: left; color: white;">Data</th>
                    <th style="padding: 0.5rem; text-align: left; color: white;">Repete?</th>
                    <th style="padding: 0.5rem; text-align: left; color: white;">Ações</th>
                </tr>
            </thead>
            <tbody id="tabela-eventos">
                </tbody>
        </table>
    </main>

</body>
</html>
