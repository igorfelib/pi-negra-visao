<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Inscrição</title>
  </head>
  <body>
    <header>
      <!-- logo -->
      <a href="#">
        <img src="" alt="logo negra visão" />
      </a>
      <!-- ao lado da logo -->
      <span>Negra visão</span>
      <nav>
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">Eventos</a></li>
          <li><a href="#">Museu</a></li>
          <li><a href="#">Biblioteca</a></li>
          <li><a href="#">Quem somos</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <div class="card-formulario">
        <h1>Inscrição em Eventos</h1>
        <p>Preencha os dados abaixo para garantir sua vaga</p>
        <form action="">
          <label for="selectEvent">Selecione o Evento *</label>
          <select id="selectEvent">
            <option value="">opção 1</option>
            <option value="">opção 2</option>
          </select>
          <div>
            <label for="cpf">CPF *</label>
            <input type="number" id="cpf" />
            <label for="name">Nome *</label>
            <input type="text" id="name" />
          </div>
          <div>
            <label for="phone">Telefone *</label>
            <input type="tel" id="phone" />
            <label for="email">E-mail *</label>
            <input type="email" id="email" />
          </div>
          <div>
            <label for="cep">CEP *</label>
            <input type="number" id="cep" />
            <label for="city">Cidade *</label>
            <input type="text" id="city" />
          </div>
        </form>
      </div>
    </main>
  </body>
</html>
